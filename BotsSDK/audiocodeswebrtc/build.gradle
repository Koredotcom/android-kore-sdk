apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'com.github.Koredotcom.android-kore-sdk'
version = System.getenv('VERSION') ?: 'local'

configurations {
    originalWebRtcSdkAar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    originalWebRtcSdkAar 'com.github.DocsInternal-Kore:WebRtcSdk:0.0.2@aar'
}

def extractedSdkDir = layout.buildDirectory.dir('generated/originalWebRtcSdk')
def originalClassesJar = extractedSdkDir.map { it.file('classes.jar') }
def originalWebRtcJar = extractedSdkDir.map { it.file('libs/libwebrtc.jar') }

tasks.register('extractOriginalWebRtcSdk') {
    inputs.files(configurations.originalWebRtcSdkAar)
    outputs.dir(extractedSdkDir)

    doLast {
        copy {
            from zipTree(configurations.originalWebRtcSdkAar.singleFile)
            into extractedSdkDir.get().asFile
        }
    }
}

tasks.register('stripOriginalCallClasses', Jar) {
    dependsOn tasks.named('extractOriginalWebRtcSdk')
    archiveFileName = 'webrtcsdk-classes-stripped.jar'
    destinationDirectory = extractedSdkDir
    from({ zipTree(originalClassesJar.get().asFile) }) {
        exclude 'com/audiocodes/mv/webrtcsdk/webrtc/ACWebRTCCall*.class'
    }
}

dependencies {
    // Ship the original AudioCodes classes and WebRTC Java bindings alongside
    // the replacement ACWebRTCCall class in the generated AAR.
    api files(tasks.named('stripOriginalCallClasses').flatMap { it.archiveFile })
    api files(originalWebRtcJar)
}

android {
    namespace 'com.audiocodes.mv.webrtcsdk'
    compileSdk 35

    defaultConfig {
        minSdkVersion 26
    }

    buildFeatures {
        buildConfig false
    }

    publishing {
        singleVariant('release')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile extractedSdkDir.map { it.file('AndroidManifest.xml') }
            res.srcDir extractedSdkDir.map { it.dir('res') }
            assets.srcDir extractedSdkDir.map { it.dir('assets') }
            jniLibs.srcDir extractedSdkDir.map { it.dir('jni') }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('extractOriginalWebRtcSdk')
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Koredotcom.android-kore-sdk'
                artifactId = 'audiocodeswebrtc'
                version = System.getenv('VERSION') ?: 'local'
            }
        }
    }
}
