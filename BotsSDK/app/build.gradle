plugins {
    id 'com.android.application'
}

def localKoreConfig = new java.util.Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localKoreConfig.load(it) }
}
def asBuildConfigString = { String value ->
    String escaped = (value ?: '').replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r')
    return '"' + escaped + '"'
}

android {
    namespace 'com.kore.korebot'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    dataBinding {
        enabled = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module', "META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }

    defaultConfig {
        applicationId "com.kore.korebot"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "KORE_JWT_TOKEN", asBuildConfigString(localKoreConfig.getProperty('kore.jwtToken', ''))
        buildConfigField "String", "KORE_CLIENT_ID", asBuildConfigString(localKoreConfig.getProperty('kore.clientId', ''))
        buildConfigField "String", "KORE_CLIENT_SECRET", asBuildConfigString(localKoreConfig.getProperty('kore.clientSecret', ''))
        buildConfigField "String", "KORE_BOT_ID", asBuildConfigString(localKoreConfig.getProperty('kore.botId', ''))
        buildConfigField "String", "KORE_IDENTITY", asBuildConfigString(localKoreConfig.getProperty('kore.identity', ''))
        buildConfigField "String", "KORE_BOT_NAME", asBuildConfigString(localKoreConfig.getProperty('kore.botName', ''))
        buildConfigField "String", "KORE_SERVER_URL", asBuildConfigString(localKoreConfig.getProperty('kore.serverUrl', ''))
        buildConfigField "String", "KORE_BRANDING_URL", asBuildConfigString(localKoreConfig.getProperty('kore.brandingUrl', ''))
        buildConfigField "String", "KORE_JWT_SERVER_URL", asBuildConfigString(localKoreConfig.getProperty('kore.jwtServerUrl', ''))
        buildConfigField "String", "KORE_CLICK_TO_CALL_FLOW_ID", asBuildConfigString(localKoreConfig.getProperty('kore.clickToCallFlowId', ''))

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation(project(':korebot')) {
        exclude module: 'support-v4'
    }

    implementation(project(':korebotsdklib')) {
        exclude module: 'support-v4'
    }

//    implementation(project(':widgetsdk')) {
//        exclude module: 'support-v4'
//    }
}
